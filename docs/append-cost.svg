<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330" role="img" aria-label="Cost of appending one entry with and without the measurement cache">
  <rect width="620" height="330" fill="#ffffff"/>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <text x="310" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#111111">Appending one entry to the list</text>
  <text x="310" y="50" text-anchor="middle" font-size="12" fill="#666666">one entry arrives, the whole list is placed again</text>
  <line x1="80" y1="270" x2="560" y2="270" stroke="#e8e8ee" stroke-width="1"/>
  <text x="72" y="274" text-anchor="end" font-size="11" fill="#666666">0</text>
  <line x1="80" y1="222.5" x2="560" y2="222.5" stroke="#e8e8ee" stroke-width="1"/>
  <text x="72" y="226.5" text-anchor="end" font-size="11" fill="#666666">350</text>
  <line x1="80" y1="175" x2="560" y2="175" stroke="#e8e8ee" stroke-width="1"/>
  <text x="72" y="179" text-anchor="end" font-size="11" fill="#666666">700</text>
  <line x1="80" y1="127.5" x2="560" y2="127.5" stroke="#e8e8ee" stroke-width="1"/>
  <text x="72" y="131.5" text-anchor="end" font-size="11" fill="#666666">1050</text>
  <line x1="80" y1="80" x2="560" y2="80" stroke="#e8e8ee" stroke-width="1"/>
  <text x="72" y="84" text-anchor="end" font-size="11" fill="#666666">1400</text>
  <line x1="80" y1="270" x2="560" y2="270" stroke="#bbbbc4" stroke-width="1"/>
  <rect x="120" y="167.9" width="72" height="102.1" fill="#c9c9d4" rx="3"/>
  <rect x="208" y="266.2" width="72" height="3.8" fill="#1f6feb" rx="3"/>
  <text x="156" y="159.9" text-anchor="middle" font-size="12" font-weight="600" fill="#55555c">752 ms</text>
  <text x="244" y="258.2" text-anchor="middle" font-size="12" font-weight="600" fill="#1f6feb">28 ms</text>
  <text x="200" y="288" text-anchor="middle" font-size="12" fill="#333333">4000 entries in the list</text>
  <rect x="360" y="97.6" width="72" height="172.4" fill="#c9c9d4" rx="3"/>
  <rect x="448" y="265.9" width="72" height="4.1" fill="#1f6feb" rx="3"/>
  <text x="396" y="89.6" text-anchor="middle" font-size="12" font-weight="600" fill="#55555c">1270 ms</text>
  <text x="484" y="257.9" text-anchor="middle" font-size="12" font-weight="600" fill="#1f6feb">30 ms</text>
  <text x="440" y="288" text-anchor="middle" font-size="12" fill="#333333">8000 entries in the list</text>
  <rect x="150" y="298" width="12" height="12" fill="#c9c9c9" rx="2"/>
  <text x="168" y="308" font-size="12" fill="#55555c">no cache: re-measures every entry</text>
  <rect x="400" y="298" width="12" height="12" fill="#1f6feb" rx="2"/>
  <text x="418" y="308" font-size="12" fill="#55555c">cache: measures the new one</text>
  </g>
</svg>
